[build-system]
requires = ["setuptools>=68","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acis-insurance-analytics"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1","numpy>=1.26","scipy>=1.11","scikit-learn>=1.4","xgboost>=2.0","shap>=0.45","matplotlib>=3.8","streamlit>=1.32"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
